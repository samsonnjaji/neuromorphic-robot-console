name: NRC Kotlin CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nrc_test
          POSTGRES_USER: nrc
          POSTGRES_PASSWORD: nrc_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nrc -d nrc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NRC_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/nrc_test
      NRC_TEST_DATABASE_USER: nrc
      NRC_TEST_DATABASE_PASSWORD: nrc_test_password
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Gradle Wrapper JAR checksum
        working-directory: gradle/wrapper
        run: sha256sum --check gradle-wrapper.jar.sha256

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Validate versioned API contracts
        run: python scripts/validate_schemas.py

      - name: Validate local Docker Compose configuration
        run: docker compose -f deploy/local/compose.yaml config --quiet

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 37
        shell: bash
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Run core, desktop and platform API tests
        run: gradle :nrc-core:jvmTest :composeApp:jvmTest :composeApp:compileKotlinJvm :platform-api:test

      - name: Build Android application
        run: gradle :androidApp:assembleDebug
