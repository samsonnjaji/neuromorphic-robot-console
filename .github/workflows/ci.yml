name: NRC Kotlin CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: nrc_test
          POSTGRES_USER: nrc
          POSTGRES_PASSWORD: ci-public-fixture-db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nrc -d nrc_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      rustfs:
        image: rustfs/rustfs:1.0.5
        env:
          RUSTFS_ACCESS_KEY: ci-public-fixture-access
          RUSTFS_SECRET_KEY: ci-public-fixture-object-key
          RUSTFS_VOLUMES: /tmp/nrc-rustfs{0...3}
          RUSTFS_ADDRESS: 0.0.0.0:9000
          RUSTFS_CONSOLE_ENABLE: "false"
          RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -fsS http://localhost:9000/health"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NRC_TEST_DATABASE_URL: jdbc:postgresql://localhost:5432/nrc_test
      NRC_TEST_DATABASE_USER: nrc
      NRC_TEST_DATABASE_PASSWORD: ci-public-fixture-db
      NRC_TEST_OBJECT_STORE_ENDPOINT: http://localhost:9000
      NRC_TEST_OBJECT_STORE_ACCESS_KEY: ci-public-fixture-access
      NRC_TEST_OBJECT_STORE_SECRET_KEY: ci-public-fixture-object-key
      NRC_TEST_OBJECT_STORE_BUCKET: nrc-ci-artifacts
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Verify Gradle Wrapper JAR checksum
        working-directory: gradle/wrapper
        run: sha256sum --check gradle-wrapper.jar.sha256

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python contract and gateway dependencies
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0 "mcap>=1.2,<2"

      - name: Install NRC edge gateway package
        run: python -m pip install --no-deps -e services/edge-gateway

      - name: Validate versioned API contracts
        run: python scripts/validate_schemas.py

      - name: Test NRC edge gateway
        run: python -m unittest discover -s services/edge-gateway/tests -v

      - name: Validate local Docker Compose configuration
        env:
          NRC_DB_CREDENTIAL: ci-public-fixture-db
          NRC_OBJECT_STORE_ACCESS_KEY: ci-public-fixture-access
          NRC_OBJECT_STORE_SECRET_KEY: ci-public-fixture-object-key
        run: docker compose -f deploy/local/compose.yaml config --quiet

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 37
        shell: bash
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Gradle from the checked-in wrapper
        uses: gradle/actions/setup-gradle@v4

      - name: Run core, desktop and platform API tests
        run: ./gradlew :nrc-core:jvmTest :composeApp:jvmTest :composeApp:compileKotlinJvm :platform-api:test

      - name: Build Android application
        run: ./gradlew :androidApp:assembleDebug
