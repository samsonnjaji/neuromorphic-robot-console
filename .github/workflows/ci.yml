name: NRC Kotlin CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install JSON Schema validator
        run: python -m pip install --disable-pip-version-check jsonschema==4.23.0

      - name: Validate versioned API contracts
        run: python scripts/validate_schemas.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android API 37
        shell: bash
        run: |
          sdkmanager "platforms;android-37.0" "build-tools;37.0.0"
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          if [ -d "$SDK_ROOT/platforms/android-37.0" ] && [ ! -e "$SDK_ROOT/platforms/android-37" ]; then
            ln -s android-37.0 "$SDK_ROOT/platforms/android-37"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.7.0'

      - name: Run core and desktop JVM tests
        run: gradle :nrc-core:jvmTest :composeApp:jvmTest :composeApp:compileKotlinJvm

      - name: Build Android application
        run: gradle :androidApp:assembleDebug
